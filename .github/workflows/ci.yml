name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: speech-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: speech-rs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: doom-fish/doom-fish-utils
          path: doom-fish-utils
          persist-credentials: false
      - run: rustc --version
      - run: swift --version && xcodebuild -version
      - run: cargo build --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features -- --skip test_request_authorization_resolves --skip request_authorization_reports_an_already_determined_status
      - run: cargo doc --no-deps --all-features
